  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .counts { color:var(--dim); font-size:13px; }
  button { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  select { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:13px; }

  main { max-width:900px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:14px; }

  .card .page { font-weight:600; font-size:15px; }
  .card .targets { color:var(--dim); font-size:12.5px; margin:2px 0 10px; }
  .field { margin-bottom:10px; }

  .cur { color:var(--dim); text-decoration:line-through; text-decoration-color:#555c69; font-size:13.5px; }
  .cur.long { text-decoration:none; opacity:.75; }
  .new { font-size:14.5px; }
  .chars { font-size:11.5px; color:var(--dim); margin-left:6px; }
  .chars.bad { color:#e0a34e; }
  .note { font-size:12.5px; color:#e0a34e; margin-top:8px; }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .actions .accept { border-color:var(--accept); color:var(--accept); }

  .actions .deny { border-color:var(--deny); color:var(--deny); }

  .status-pill { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--border); color:var(--dim); }
  .status-pill.accepted { border-color:var(--accept); color:var(--accept); }
  .status-pill.denied { border-color:var(--deny); color:var(--deny); }
  textarea { width:100%; background:#12151b; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font:13px/1.4 inherit; resize:vertical; min-height:34px; margin-top:8px; }
  .empty { text-align:center; color:var(--dim); padding:60px 0; }

<script>
const SUFFIX = " | Steel Docs";
const raw = JSON.parse(document.getElementById("data").textContent);
const LS_KEY = "seo-p0-triage-v2";
const saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
const items = raw.items.map(it => Object.assign({}, it, saved[it.id] || {}));
let undoStack = JSON.parse(localStorage.getItem(LS_KEY + "-undo") || "[]");
let focusIdx = 0;

function persist() {
  const state = {};
  items.forEach(it => state[it.id] = { status: it.status, comment: it.comment });
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  localStorage.setItem(LS_KEY + "-undo", JSON.stringify(undoStack));
}

function charSpan(text, kind) {
  const n = text.length;
  let bad = false, extra = "";
  if (kind === "title") { const total = n + SUFFIX.length; extra = ` (+suffix = ${total})`; bad = total > 65; }
  else { bad = n < 120 || n > 165; }
  return `<span class="chars${bad ? " bad" : ""}">${n} chars${extra}</span>`;
}

function visible() {
  const f = document.getElementById("filter").value;
  return items.filter(it => f === "all" || it.status === f);
}

function render() {
  const list = document.getElementById("list");
  const vis = visible();
  if (focusIdx >= vis.length) focusIdx = Math.max(0, vis.length - 1);
  list.innerHTML = vis.length ? "" : `<div class="empty">Nothing ${document.getElementById("filter").value} — change the filter or export.</div>`;
  vis.forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i === focusIdx ? " focused" : "");
    card.innerHTML = `
      <div class="page">${it.page} <span class="status-pill ${it.status}">${it.status}</span></div>
      <div class="targets">${it.targets}</div>
      <div class="targets">sidebar → ${esc(it.sidebar || "")}</div>
      <div class="field">
        <div class="label">Title / H1</div>
        <div class="cur">${esc(it.current.title)}</div>
        <div class="new">${esc(it.proposed.title)} ${charSpan(it.proposed.title, "title")}</div>
      </div>
      <div class="field">
        <div class="label">Meta description</div>
        <div class="cur long">${esc(it.current.description)}</div>
        <div class="new">${esc(it.proposed.description)} ${charSpan(it.proposed.description, "desc")}</div>
      </div>
      ${it.proposed.note ? `<div class="note">⚑ ${esc(it.proposed.note)}</div>` : ""}
      <div class="actions">
        <button class="accept">Accept (a)</button>
        <button class="deny">Deny (d)</button>
      </div>
      <textarea placeholder="Comment — carries rewrite instructions…">${esc(it.comment || "")}</textarea>`;
    card.querySelector(".accept").onclick = () => decide(it.id, "accepted");
    card.querySelector(".deny").onclick = () => decide(it.id, "denied");
    card.querySelector("textarea").oninput = e => { it.comment = e.target.value; persist(); };
    card.onclick = () => { focusIdx = i; highlight(); };
    list.appendChild(card);
  });
  const c = { pending: 0, accepted: 0, denied: 0 };
  items.forEach(it => c[it.status]++);
  document.getElementById("counts").textContent = `${c.pending} pending · ${c.accepted} accepted · ${c.denied} denied`;
}

function highlight() {
  document.querySelectorAll(".card").forEach((el, i) => el.classList.toggle("focused", i === focusIdx));
}

function decide(id, status) {
  const it = items.find(x => x.id === id);
  undoStack.push({ id, prev: it.status });
  it.status = status;
  persist();
  render();
}

function undo() {
  const last = undoStack.pop();
  if (!last) return;
  items.find(x => x.id === last.id).status = last.prev;
  persist();
  render();
}

function exportJson() {
  const out = Object.assign({}, raw, { items });
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "seo-p0-triage.reviewed.json";
  a.click();
}

function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

document.getElementById("filter").onchange = () => { focusIdx = 0; render(); };
document.getElementById("undo").onclick = undo;
document.getElementById("export").onclick = exportJson;

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") e.target.blur(); return; }
  const vis = visible();
  if (e.key === "j") { focusIdx = Math.min(focusIdx + 1, vis.length - 1); highlight(); scrollToFocus(); }
  else if (e.key === "k") { focusIdx = Math.max(focusIdx - 1, 0); highlight(); scrollToFocus(); }
  else if (e.key === "a" && vis[focusIdx]) decide(vis[focusIdx].id, "accepted");
  else if (e.key === "d" && vis[focusIdx]) decide(vis[focusIdx].id, "denied");
  else if (e.key === "u") undo();
  else if (e.key === "e") exportJson();
  else if (e.key === "c") { const el = document.querySelectorAll(".card")[focusIdx]; if (el) { e.preventDefault(); el.querySelector("textarea").focus(); } }
});

function scrollToFocus() {
  const el = document.querySelectorAll(".card")[focusIdx];
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

render();
</script>
