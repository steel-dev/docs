<!DOCTYPE html>
<!-- ABOUTME: Triage UI for proposed internal cross-links in Steel docs.
     ABOUTME: Review each proposed link in context, accept/reject/maybe, then export JSON. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Docs — Cross-Link Triage</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --border:#272c34;
    --txt:#e6e9ee; --muted:#8b94a3; --accent:#5b9dff;
    --high:#ff6b6b; --medium:#ffb454; --low:#7c8c9c;
    --accept:#3fb950; --reject:#f85149; --maybe:#d29922;
    --link:#5b9dff; --linkbg:rgba(91,157,255,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 18px}
  h1{margin:0 0 8px;font-size:18px;font-weight:650}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .bar > *{flex:0 0 auto}
  .stat{font-size:12px;color:var(--muted)}
  .stat b{color:var(--txt)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--panel2)}
  select,input[type=text]{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:13px}
  input[type=text]{min-width:200px}
  button{cursor:pointer;background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06101f}
  .spacer{flex:1 1 auto}
  main{padding:14px 18px 120px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:11px;margin-bottom:12px;overflow:hidden;transition:opacity .15s}
  .card.focused{outline:2px solid var(--accent)}
  .card[data-status=accept]{border-left:4px solid var(--accept)}
  .card[data-status=reject]{border-left:4px solid var(--reject);opacity:.5}
  .card[data-status=maybe]{border-left:4px solid var(--maybe)}
  .card[data-status=undecided]{border-left:4px solid var(--border)}
  .chead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .id{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prio{text-transform:uppercase;font-size:10px;letter-spacing:.5px;padding:2px 8px;border-radius:99px;font-weight:700}
  .prio.high{background:rgba(255,107,107,.18);color:var(--high)}
  .prio.medium{background:rgba(255,180,84,.18);color:var(--medium)}
  .prio.low{background:rgba(124,140,160,.18);color:#9aa6b6}
  .route{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .route a{color:var(--link);text-decoration:none}
  .route a:hover{text-decoration:underline}
  .arrow{color:var(--muted)}
  .ctx{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;text-transform:uppercase;letter-spacing:.4px}
  .warn{font-size:10px;color:var(--maybe);border:1px solid var(--maybe);border-radius:5px;padding:1px 6px}
  .cbody{padding:12px 14px;display:grid;grid-template-columns:1fr;gap:10px}
  .snip{background:#0b0d10;border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:13.5px;line-height:1.6}
  .snip code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:#1d222b;padding:1px 5px;border-radius:4px}
  .snip a.proposed{background:var(--linkbg);color:var(--link);padding:1px 4px;border-radius:4px;text-decoration:none;border-bottom:2px solid var(--link);font-weight:600}
  .meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
  .meta .lbl{color:#6f7785;text-transform:uppercase;font-size:10px;letter-spacing:.4px;margin-right:5px}
  .anchoredit{display:flex;align-items:center;gap:6px}
  .anchoredit input{font-family:ui-monospace,monospace;font-size:12px;min-width:240px}
  .rationale{font-size:12.5px;color:#aab3c0}
  .note{font-size:12px;color:var(--maybe)}
  .actions{display:flex;gap:7px;align-items:center}
  .actions button{padding:5px 14px}
  .b-accept[data-on=1]{background:var(--accept);border-color:var(--accept);color:#06140a}
  .b-maybe[data-on=1]{background:var(--maybe);border-color:var(--maybe);color:#1a1304}
  .b-reject[data-on=1]{background:var(--reject);border-color:var(--reject);color:#1a0606}
  .empty{color:var(--muted);text-align:center;padding:40px}
  kbd{background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px;font-family:ui-monospace,monospace}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 18px;display:flex;gap:12px;align-items:center;z-index:10}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--accept);color:#06140a;padding:9px 18px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  dialog{background:var(--panel);color:var(--txt);border:1px solid var(--border);border-radius:12px;max-width:760px;width:92vw;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .dlg-b{padding:14px 16px}
  textarea{width:100%;height:340px;background:#0b0d10;color:var(--txt);border:1px solid var(--border);border-radius:8px;font-family:ui-monospace,monospace;font-size:12px;padding:10px}
</style>
</head>
<body>
<header>
  <h1>Steel Docs — Cross-Link Triage <span class="stat" style="font-weight:400">142 proposed internal links</span></h1>
  <div class="bar">
    <select id="f-prio"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
    <select id="f-section"><option value="">All sections</option></select>
    <select id="f-status"><option value="">All statuses</option><option value="undecided">Undecided</option><option value="accept">Accepted</option><option value="maybe">Maybe</option><option value="reject">Rejected</option></select>
    <select id="f-found"><option value="">Found + Not-found</option><option value="true">Found only</option><option value="false">Not-found only</option></select>
    <input type="text" id="f-q" placeholder="Search source / target / text…">
    <span class="spacer"></span>
    <span class="stat" id="counts"></span>
  </div>
  <div class="bar" style="margin-top:8px">
    <button id="acc-filtered">Accept all filtered</button>
    <button id="rej-filtered">Reject all filtered</button>
    <button id="acc-high">Accept all High</button>
    <button id="reset">Reset decisions</button>
    <span class="spacer"></span>
    <span class="stat">Keys: <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>a</kbd> accept · <kbd>m</kbd> maybe · <kbd>r</kbd> reject</span>
  </div>
</header>
<main id="list"></main>
<footer>
  <span class="stat" id="footstat"></span>
  <span class="spacer"></span>
  <button id="export-accepted" class="primary">Export accepted JSON →</button>
  <button id="export-all">Export all decisions</button>
</footer>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dlg-h"><b id="dlg-title">Export</b><span class="spacer"></span><button id="dlg-copy">Copy</button><button id="dlg-dl">Download .json</button><button id="dlg-close">Close</button></div>
  <div class="dlg-b"><div class="stat" id="dlg-note" style="margin-bottom:8px"></div><textarea id="dlg-text" readonly></textarea></div>
</dialog>

<script>
const DATA = [{"id": 1, "priority": "high", "source": "/overview/sessions-api/session-lifecycle", "target": "/overview/pricinglimits", "rationale": "The page states per-minute billing and plan-dependent session limits but never links to the page that defines plan tiers, browser-hour rates, and session-time limits.", "found": true, "context": "prose", "note": "", "snippet": "Browser sessions are billed and metered by the minute. A session can last up to 24 hours depending on your plan.", "anchorText": "billed and metered by the minute", "linkedSnippet": "Browser sessions are [billed and metered by the minute](/overview/pricinglimits). A session can last up to 24 hours depending on your plan.", "sourceFile": "content/docs/overview/sessions-api/session-lifecycle.mdx", "section": "overview"}, {"id": 2, "priority": "medium", "source": "/overview/sessions-api/session-lifecycle", "target": "/overview/sessions-api/overview", "rationale": "The lifecycle page opens by defining what a session is but does not link to the Sessions API overview that introduces the concept in full.", "found": true, "context": "prose", "note": "First line under the ### Overview heading; straightforward prose with no existing link.", "snippet": "Sessions are the foundation of browser automation in Steel. Each session represents an isolated browser instance that persists until it's either explicitly released or times out.", "anchorText": "Sessions are the foundation of browser automation in Steel", "linkedSnippet": "[Sessions are the foundation of browser automation in Steel](/overview/sessions-api/overview). Each session represents an isolated browser instance that persists until it's either explicitly released or times out.", "sourceFile": "content/docs/overview/sessions-api/session-lifecycle.mdx", "section": "overview"}, {"id": 3, "priority": "medium", "source": "/overview/sessions-api/mobile-mode", "target": "/overview/stealth/proxies", "rationale": "Mobile mode advertises proxy compatibility but inkedSnippet": "", "sourceFile": "content/docs/overview/sessions-api/mobile-mode.mdx", "section": "overview"}, {"id": 6, "priority": "high", "source": "/overview/credentials-api/overview", "target": "/cookbook/credentials", "rationale": "The overview describes injecting credentials with browser frameworks but never points to the runnable Credentials cookbook recipe that demonstrates the full login flow.", "found": true, "context": "prose", "note": "Plain prose, straightforward. 'this guide' is the most natural anchor for the runnable Credentials cookbook recipe; not already a link.", "snippet": "We plan to release official helpers and utilities for common frameworks like `browser-use`, `Playwright`, and `Puppeteer` soon. For now, you can build on this guide to integrate Steel into your existing automation workflows.", "anchorText": "this guide", "linkedSnippet": "We plan to release official helpers and utilities for common frameworks like `browser-use`, `Playwright`, and `Puppeteer` soon. For now, you can build on [this guide](/cookbook/credentials) to integrate Steel into your existing automation workflows.", "sourceFile": "content/docs/overview/credentials-api/overview.mdx", "section": "overview"}, {"id": 7, "priority": "medium", "source": "/overview/credentials-api/overview", "target": "/integrations/browser-use", "rationale": "The Using with Agent Frameworks section names browser-use specifically as the integration target but does not link to its integration page.", "found": true, "context": "prose", "note": "anchorText is an inline code span (backticks included); MDX renders [`browser-use`](...) as a linked code span. First occurrence is in the 'Using with Agent Frameworks' section intro; not already a link.", "snippet": "Steel is designed to integrate seamlessly with browser automation tools and agent frameworks such as `browser-use` and similar libraries.", "anchorText": "`browser-use`", "linkedSnippet": "Steel is designed to integrate seamlessly with browser automation tools and agent frameworks such as [`browser-use`](/integrations/browser-use) and similar libraries.", "sourceFile": "content/docs/overview/credentials-api/overview.mdx", "section": "overview"}, {"id": 8, "priority": "medium", "source": "/overview/agent-traces/overview", "target": "/overview/sessions-api/embed-sessions/past-sessions", "rationale": "Agent Traces are tied to session recordings and replays, yet the page never links to the recordings/replay documentation that explains how those videos are produced and embedded.", "found": true, "context": "table", "note": "Table cell - safe; anchor is the most literal match for the 'jump the recording to the moment' / video-synced replay concept tying to the recordings/replay docs.", "snippet": "| **Video sync** | Click a row to jump the recording to the moment that activity happened. |", "anchorText": "jump the recording to the moment", "linkedSnippet": "| **Video sync** | Click a row to [jump the recording to the moment](/overview/sessions-api/embed-sessions/past-sessions) that activity happened. |", "sourceFile": "content/docs/overview/agent-traces/overview.mdx", "section": "overview"}, {"id": 9, "priority": "high", "source": "/overview/self-hosting/steel-local-vs-steel-cloud", "target": "/overview/captchas-api/overview", "rationale": "The comparison table explicitly names the Captchas API as a Cloud capability but the phrase is plain text with no link to the Captchas API page.", "found": true, "context": "table", "note": "Table cell; anchorText 'Captchas API' chosen over full phrase for specificity. Replacing first occurrence keeps cell padding intact.", "snippet": "| Captcha Solving  | None                                      | Supported with the Captchas API                              |", "anchorText": "Captchas API", "linkedSnippet": "| Captcha Solving  | None                                      | Supported with the [Captchas API](/overview/captchas-api/overview)                              |", " s' as a placeholder for a link that was never added; the stealth/CAPTCHA-prevention page is the canonical target.", "found": true, "context": "table", "note": "Table cell; '(docs)' is a placeholder for a link that was never added. Used the full 'Advanced Stealth (docs)' as anchor; alternatively just 'docs' could be linked, but linking the whole phrase reads better.", "snippet": "| Stealth          | Limited                                   | Advanced Stealth (docs)                                      |", "anchorText": "Advanced Stealth (docs)", "linkedSnippet": "| Stealth          | Limited                                   | [Advanced Stealth (docs)](/overview/stealth/captcha-solving)                                      |", "sourceFile": "content/docs/overview/self-hosting/steel-local-vs-steel-cloud.mdx", "section": "overview"}, {"id": 15, "priority": "medium", "source": "/overview/self-hosting/steel-local-vs-steel-cloud", "target": "/overview/sessions-api/multi-region", "rationale": "The Multi-Region row describes the region flag on session creation without linking to the multi-region documentation that explains it.", "found": true, "context": "table", "note": "Table cell; anchor matches the opportunity's 'region flag during session creation' phrase verbatim.", "snippet": "| Multi-Region     | Host it yourself                          | Supported with region flag during session creation           |", "anchorText": "region flag during session creation", "linkedSnippet": "| Multi-Region     | Host it yourself                          | Supported with [region flag during session creation](/overview/sessions-api/multi-region)           |", "sourceFile": "content/docs/overview/self-hosting/steel-local-vs-steel-cloud.mdx", "section": "overview"}, {"id": 16, "priority": "medium", "source": "/integrations/stackblitz-bolt.new", "target": "/integrations/puppeteer", "rationale": "The page offers a Puppeteer starter template but does not link to the Puppeteer integration p const DOCS_BASE = "https://docs.steel.dev";
const LS_KEY = "steel-xlink-triage-v1";
let state = {}; // id -> {status, anchorText}
try { state = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); } catch(e){ state={}; }

// init per-row state
DATA.forEach(d=>{
  if(!state[d.id]) state[d.id] = {status:"undecided", anchorText:d.anchorText};
  if(state[d.id].anchorText===undefined) state[d.id].anchorText=d.anchorText;
});
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

// populate section filter
const sections=[...new Set(DATA.map(d=>d.section))].sort();
const fsec=document.getElementById("f-section");
sections.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;fsec.appendChild(o);});

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// render linkedSnippet markdown -> html (code spans + the single proposed link)
function renderSnippet(md){
  // escape first
  let h=esc(md);
  // proposed link [text](route)  (text may contain escaped backticks/markup)
  h=h.replace(/\[([^\]]+)\]\((\/[^)]+)\)/g,(m,t,u)=>{
    const inner=t.replace(/`([^`]+)`/g,'<code>$1</code>');
    return '<a class="proposed" href="'+DOCS_BASE+u+'" target="_blank" title="links to '+u+'">'+inner+'</a>';
  });
  // remaining inline code
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  // bold
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return h;
}

const list=document.getElementById("list");
function filters(){
  return {
    prio:document.getElementById("f-prio").value,
    section:document.getElementById("f-section").value,
    status:document.getElementById("f-status").value,
    found:document.getElementById("f-found").value,
    q:document.getElementById("f-q").value.toLowerCase().trim()
  };
}
function visible(){
  const f=filters();
  return DATA.filter(d=>{
    if(f.prio&&d.priority!==f.prio)return false;
    if(f.section&&d.section!==f.section)return false;
    if(f.status&&state[d.id].status!==f.status)return false;
    if(f.found&&String(d.found)!==f.found)return false;
    if(f.q){const hay=(d.source+" "+d.target+" "+d.snippet+" "+d.rationale).toLowerCase();if(!hay.includes(f.q))return false;}
    return true;
  });
}
let focusIdx=0;
function render(){
  const vis=visible();
  list.innerHTML="";
  if(!vis.length){list.innerHTML='<div class="empty">No rows match the current filters.</div>';updateCounts(vis);return;}
  vis.forEach((d,i)=>{
    const st=state[d.id];
    const card=document.createElement("div");
    card.className="card"+(i===focusIdx?" focused":"");
    card.dataset.status=st.status;card.dataset.id=d.id;
    card.innerHTML=`
      <div class="chead">
        <span class="id">#${String(d.id).padStart(3,"0")}</span>
        <span class="prio ${d.priority}">${d.priority}</span>
        <span class="route"><a href="${DOCS_BASE}${d.source}" target="_blank">${esc(d.source)}</a></span>
        <span class="arrow">→</span>
        <span class="route"><a href="${DOCS_BASE}${d.target}" target="_blank">${esc(d.target)}</a></span>
        <span class="ctx">${d.context}</span>
        ${d.found?"":'<span class="warn">⚠ not-found — needs manual placement</span>'}
      </div>
      <div class="cbody">
        <div class="snip">${renderSnippet(d.linkedSnippet)}</div>
        <div class="rationale">${esc(d.rationale)}</div>
        ${d.note?`<div class="note">⚑ ${esc(d.note)}</div>`:""}
        <div class="meta">
          <span class="anchoredit"><span class="lbl">Anchor</span><input type="text" data-id="${d.id}" value="${esc(st.anchorText||"")}"></span>
          <span><span class="lbl">File</span><code>${esc(d.sourceFile)}</code></span>
        </div>
        <div class="actions">
          <button class="b-accept" data-act="accept" data-id="${d.id}" data-on="${st.status==='accept'?1:0}">✓ Accept</button>
          <button class="b-maybe" data-act="maybe" data-id="${d.id}" data-on="${st.status==='maybe'?1:0}">? Maybe</button>
          <button class="b-reject" data-act="reject" data-id="${d.id}" data-on="${st.status==='reject'?1:0}">✕ Reject</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
  updateCounts(vis);
}
function updateCounts(vis){
  const c={accept:0,maybe:0,reject:0,undecided:0};
  DATA.forEach(d=>c[state[d.id].status]++);
  document.getElementById("counts").innerHTML=`Showing <b>${vis.length}</b> · ✓ <b>${c.accept}</b> ? <b>${c.maybe}</b> ✕ <b>${c.reject}</b> · <b>${c.undecided}</b> left`;
  document.getElementById("footstat").innerHTML=`<b>${c.accept}</b> accepted · <b>${c.maybe}</b> maybe · <b>${c.reject}</b> rejected · <b>${c.undecided}</b> undecided`;
}
function setStatus(id,s){ state[id].status=(state[id].status===s?"undecided":s); save(); render(); }

list.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");
  if(b){setStatus(+b.dataset.id,b.dataset.act);return;}
  const card=e.target.closest(".card");
  if(card){const vis=visible();focusIdx=vis.findIndex(d=>d.id==card.dataset.id);render();}
});
list.addEventListener("input",e=>{
  const inp=e.target.closest("input[type=text][data-id]");
  if(inp){state[+inp.dataset.id].anchorText=inp.value;save();}
});
["f-prio","f-section","f-status","f-found","f-q"].forEach(id=>{
  document.getElementById(id).addEventListener("input",()=>{focusIdx=0;render();});
});
document.getElementById("acc-filtered").onclick=()=>{visible().forEach(d=>state[d.id].status="accept");save();render();};
document.getElementById("rej-filtered").onclick=()=>{visible().forEach(d=>state[d.id].status="reject");save();render();};
document.getElementById("acc-high").onclick=()=>{DATA.filter(d=>d.priority==="high").forEach(d=>state[d.id].status="accept");save();render();};
document.getElementById("reset").onclick=()=>{if(confirm("Reset all triage decisions?")){DATA.forEach(d=>{state[d.id]={status:"undecided",anchorText:d.anchorText};});save();render();}};

document.addEventListener("keydown",e=>{
  if(/input|textarea|select/i.test(e.target.tagName))return;
  const vis=visible();if(!vis.length)return;
  if(e.key==="j"){focusIdx=Math.min(focusIdx+1,vis.length-1);render();scrollFocus();}
  else if(e.key==="k"){focusIdx=Math.max(focusIdx-1,0);render();scrollFocus();}
  else if(e.key==="a"){setStatus(vis[focusIdx].id,"accept");}
  else if(e.key==="m"){setStatus(vis[focusIdx].id,"maybe");}
  else if(e.key==="r"){setStatus(vis[focusIdx].id,"reject");}
});
function scrollFocus(){const el=list.querySelector(".card.focused");if(el)el.scrollIntoView({block:"center",behavior:"smooth"});}

// ---- export ----
function buildExport(onlyAccepted){
  const rows=DATA.filter(d=>onlyAccepted?state[d.id].status==="accept":state[d.id].status!=="undecided")
    .map(d=>({
      id:d.id,
      status:state[d.id].status,
      priority:d.priority,
      sourceFile:d.sourceFile,
      sourceRoute:d.source,
      targetRoute:d.target,
      anchorText:state[d.id].anchorText,
      snippet:d.snippet,
      linkedSnippet:d.linkedSnippet,
      context:d.context,
      found:d.found,
      note:d.note,
      rationale:d.rationale
    }));
  return rows;
}
const dlg=document.getElementById("dlg");
function openExport(onlyAccepted){
  const rows=buildExport(onlyAccepted);
  document.getElementById("dlg-title").textContent=onlyAccepted?`Export — ${rows.length} accepted links`:`Export — ${rows.length} decisions`;
  document.getElementById("dlg-note").textContent=onlyAccepted
    ? "Hand this back to Claude: \"implement these cross-links\". Each row has the exact file, snippet, and anchorText for a precise find-and-replace."
    : "All non-undecided decisions (accepted + maybe + rejected).";
  document.getElementById("dlg-text").value=JSON.stringify(rows,null,2);
  dlg.dataset.fname=onlyAccepted?"cross-links-accepted.json":"cross-links-decisions.json";
  dlg.showModal();
}
document.getElementById("export-accepted").onclick=()=>openExport(true);
document.getElementById("export-all").onclick=()=>openExport(false);
document.getElementById("dlg-close").onclick=()=>dlg.close();
document.getElementById("dlg-copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("dlg-text").value).then(()=>toast("Copied to clipboard"));};
document.getElementById("dlg-dl").onclick=()=>{
  const blob=new Blob([document.getElementById("dlg-text").value],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=dlg.dataset.fname;a.click();toast("Downloaded");
};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}

render();
</script>
</body>
